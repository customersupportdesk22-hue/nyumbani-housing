<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nyumbani Housing - Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f8f6;
  color:#172033;
}

header{
  background:#087f5b;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.logout{
  background:white;
  color:#087f5b;
  border:0;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 18px;
}

.welcome{
  background:white;
  padding:22px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.welcome h2{
  margin-top:0;
  color:#087f5b;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:22px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h3{
  margin:0 0 10px;
}

.number{
  font-size:32px;
  font-weight:bold;
  color:#087f5b;
}

.section{
  background:white;
  padding:22px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.section h2{
  margin-top:0;
  color:#087f5b;
}

button.action{
  background:#087f5b;
  color:white;
  border:0;
  padding:13px 18px;
  border-radius:8px;
  font-weight:bold;
  margin:5px;
}

button.action:hover{
  background:#066b4c;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

label{
  font-weight:bold;
}

.message{
  margin-top:10px;
  font-weight:bold;
}

@media(max-width:700px){
  .cards{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🏠 Nyumbani Housing Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome to the Admin Dashboard</h2>
    <p>Manage Nyumbani Housing properties and listings from here.</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>🏠 Properties</h3>
      <div class="number" id="propertyCount">0</div>
      <p>Total property listings</p>
    </div>

    <div class="card">
      <h3>📍 Locations</h3>
      <div class="number">2</div>
      <p>Nairobi & Nakuru</p>
    </div>

    <div class="card">
      <h3>👤 Admin</h3>
      <div class="number">✓</div>
      <p>Logged in</p>
    </div>

  </div>

  <div class="section">

    <h2>➕ Add Property</h2>

    <label>Property Name</label>
    <input id="propertyName" type="text"
      placeholder="e.g. Green View Apartments">

    <label>Location</label>
    <select id="location">
      <option value="">Select location</option>
      <option>Nairobi</option>
      <option>Nakuru</option>
    </select>

    <label>Property Type</label>
    <select id="propertyType">
      <option value="">Select property type</option>
      <option>House</option>
      <option>Apartment</option>
      <option>Bedsitter</option>
      <option>
