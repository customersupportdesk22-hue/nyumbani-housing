<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nyumbani Housing Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f8f5;
  color:#172033;
}

header{
  background:#087f5b;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:22px;
}

.logout{
  background:white;
  color:#087f5b;
  border:0;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px;
}

.box{
  background:white;
  padding:22px;
  margin-bottom:18px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
  color:#087f5b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
}

.number{
  font-size:35px;
  font-weight:bold;
  color:#087f5b;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  margin-top:7px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:110px;
}

.add{
  width:100%;
  margin-top:18px;
  padding:15px;
  background:#087f5b;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.photo-preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.photo-preview img{
  width:110px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
}

.property{
  border:1px solid #ddd;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.property h3{
  color:#087f5b;
  margin-top:0;
}

.property-images{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:12px;
}

.property-images img{
  width:130px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  flex-shrink:0;
}

.delete{
  background:#d92d20;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<h1>🏠 Nyumbani Housing Admin</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</header>


<div class="container">


<div class="box">

<h2>Welcome to the Admin Dashboard</h2>

<p>
Manage Nyumbani Housing properties and listings from here.
</p>

</div>


<div class="stats">

<div class="stat">

<h3>🏠 Properties</h3>

<div class="number" id="propertyCount">
0
</div>

<p>Total property listings</p>

</div>


<div class="stat">

<h3>📍 Locations</h3>

<div class="number">
2
</div>

<p>Nairobi & Nakuru</p>

</div>

</div>


<div class="box">

<h2>➕ Add Property</h2>


<label>
Property Name
</label>

<input
id="propertyName"
type="text"
placeholder="e.g. Green View Apartments"
>


<label>
Location
</label>

<select id="location">

<option value="">
Select location
</option>

<option value="Nairobi">
Nairobi
</option>

<option value="Nakuru">
Nakuru
</option>

</select>


<label>
Area / Landmark
</label>

<input
id="area"
type="text"
placeholder="e.g. Westlands, CBD, Ngara, Stage, Mall"
>


<label>
Property Type
</label>

<select id="propertyType">

<option value="">
Select property type
</option>

<option value="House">
House
</option>

<option value="Apartment">
Apartment
</option>

<option value="Bedsitter">
Bedsitter
</option>

<option value="Single Room">
Single Room
</option>

<option value="Studio">
Studio
</option>

<option value="Maisonette">
Maisonette
</option>

<option value="Commercial">
Commercial
</option>

</select>


<label>
Monthly Rent (KES)
</label>

<input
id="price"
type="number"
placeholder="e.g. 15000"
>


<label>
Viewing Fee (KES)
</label>

<input
id="viewingFee"
type="number"
value="1500"
min="0"
>


<label>
Description
</label>

<textarea
id="description"
placeholder="Describe the property, nearby mall, college, university, stage or other landmark..."
></textarea>


<label>
Property Photos
</label>

<input
id="imageFiles"
type="file"
accept="image/*"
multiple
>

<p>
📷 Select multiple photos from your phone gallery.
</p>

<div
id="photoPreview"
class="photo-preview"
></div>


<label>
Contact Phone
</label>

<input
id="phone"
type
