<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyumbani Housing - Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #087f73, #064e49);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #087f73;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #087f73;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #087f73;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #087f73;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🏠</div>

    <h1>Nyumbani Housing</h1>

    <p class="subtitle">Admin Dashboard Login</p>

    <form id="loginForm">

      <label for="email">Admin Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit" id="loginBtn">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Nyumbani Housing
    </a>

  </div>

<script>

  const SUPABASE_URL =
    "https://lcevyljupucnynpivygr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_GYJxHmYaDMn-8McoGduBLw_ZMhWg5EO";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loginForm =
    document.getElementById("loginForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    message.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.style.color = "red";
      message.textContent =
        error.message;

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      return;
    }

    message.style.color = "green";
    message.textContent =
      "Login successful!";

    setTimeout(function() {

      window.location.href =
        "admin-dashboard.html";

    }, 700);

  });

</script>

</body>
</html>
