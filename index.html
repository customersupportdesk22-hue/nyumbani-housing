<script>

const SUPABASE_URL =
"https://lcevyljupucnynpivygr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GYJxHmYaDMn-8McoGduBLw_ZMhWg5EO";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allProperties = [];


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   GET PROPERTY IMAGE
================================ */

function getFirstImage(property){

let urls = property.image_urls;

if(typeof urls === "string"){

try{

urls = JSON.parse(urls);

}catch(error){

console.error(
"Could not parse image_urls:",
urls
);

return "";

}

}

if(Array.isArray(urls) && urls.length > 0){

return String(urls[0]);

}

return "";

}


/* ================================
   CREATE IMAGE
================================ */

function createImageHTML(property){

const imageUrl =
getFirstImage(property);

if(!imageUrl){

return '<div class="placeholder">🏠</div>';

}

return `
<img
src="${escapeHtml(imageUrl)}"
alt="${escapeHtml(property.title || "Property")}"
loading="lazy"
onerror="
this.onerror=null;
this.outerHTML='<div class=&quot;placeholder&quot;>🏠</div>';
"
>
`;

}


/* ================================
   LOAD PROPERTIES
================================ */

async function loadProperties(){

const loading =
document.getElementById("loading");

try{

const {data,error} =
await supabaseClient
.from("properties")
.select("*")
.eq("published",true)
.order("created_at",{ascending:false});

if(error){

throw error;

}

console.log(
"Properties loaded:",
data
);

allProperties =
data || [];

if(loading){

loading.style.display =
"none";

}

renderProperties(
allProperties
);

}catch(error){

console.error(
"Property loading error:",
error
);

if(loading){

loading.style.display =
"none";

}

const propertyGrid =
document.getElementById(
"propertyGrid"
);

if(propertyGrid){

propertyGrid.innerHTML = "";

}

const emptyState =
document.getElementById(
"emptyState"
);

if(emptyState){

emptyState.style.display =
"block";

}

const listingCount =
document.getElementById(
"listingCount"
);

if(listingCount){

listingCount.textContent =
"Unable to load listings";

}

}

}


/* ================================
   RENDER PROPERTIES
================================ */

function renderProperties(properties){

const grid =
document.getElementById(
"propertyGrid"
);

const empty =
document.getElementById(
"emptyState"
);

const count =
document.getElementById(
"listingCount"
);

if(!grid){

console.error(
"propertyGrid element not found"
);

return;

}

grid.innerHTML = "";

if(count){

count.textContent =
properties.length +
(
properties.length === 1
? " property available"
: " properties available"
);

}

if(properties.length === 0){

if(empty){

empty.style.display =
"block";

}

return;

}

if(empty){

empty.style.display =
"none";

}


properties.forEach(
property => {

const card =
document.createElement(
"div"
);

card.className =
"card";


const imageHTML =
createImageHTML(
property
);


const rent =
Number(
property.price || 0
).toLocaleString();


const description =
property.description ||
"No description provided.";


const shortDescription =
description.length > 150
? description.substring(0,150) + "..."
: description;


card.innerHTML = `

<div class="photo">

${imageHTML}

<div class="live">
● LIVE
</div>

<div class="type">
${escapeHtml(
property.property_type ||
"Property"
)}
</div>

</div>


<div class="card-body">

<h3>
${escapeHtml(
property.title ||
"Property"
)}
</h3>


<div class="location">

📍
${escapeHtml(
property.area || ""
)}

${
property.area &&
property.location
? ", "
: ""
}

${escapeHtml(
property.location || ""
)}

</div>


<div class="price">

KSh ${rent} /
${escapeHtml(
property.price_period ||
"month"
)}

</div>


<div class="preview">

${escapeHtml(
shortDescription
)}

</div>


<div class="card-buttons">

<button
class="details-btn"
onclick="showDetails(${property.id})"
>
View Details
</button>


<button
class="book-btn"
onclick="bookTour(${property.id})"
>
Book Tour
</button>

</div>

</div>

`;

grid.appendChild(
card
);

});

}


/* ================================
   PROPERTY DETAILS
================================ */

function showDetails(id){

const property =
allProperties.find(
p =>
Number(p.id) ===
Number(id)
);

if(!property){

return;

}


const modalTitle =
document.getElementById(
"modalTitle"
);

if(modalTitle){

modalTitle.textContent =
property.title ||
"Property";

}


const modalLocation =
document.getElementById(
"modalLocation"
);

if(modalLocation){

modalLocation.textContent =
"📍 " +
(property.area || "") +
(
property.area &&
property.location
? ", "
: ""
) +
(property.location || "");

}


const modalPrice =
document.getElementById(
"modalPrice"
);

if(modalPrice){

modalPrice.textContent =
"KSh " +
Number(
property.price || 0
).toLocaleString() +
" / " +
(
property.price_period ||
"month"
);

}


const modalType =
document.getElementById(
"modalType"
);

if(modalType){

modalType.textContent =
property.property_type ||
"Not specified";

}


const modalArea =
document.getElementById(
"modalArea"
);

if(modalArea){

modalArea.textContent =
property.area ||
"Not specified";

}


const modalBedrooms =
document.getElementById(
"modalBedrooms"
);

if(modalBedrooms){

modalBedrooms.textContent =
property.bedrooms !== null &&
property.bedrooms !== undefined
? property.bedrooms
: "Not specified";

}


const modalBathrooms =
document.getElementById(
"modalBathrooms"
);

if(modalBathrooms){

modalBathrooms.textContent =
property.bathrooms !== null &&
property.bathrooms !== undefined
? property.bathrooms
: "Not specified";

}


const modalDeposit =
document.getElementById(
"modalDeposit"
);

if(modalDeposit){

modalDeposit.textContent =
property.security_deposit
? "KSh " +
Number(
property.security_deposit
).toLocaleString()
: "Not specified";

}


const modalAvailability =
document.getElementById(
"modalAvailability"
);

if(modalAvailability){

modalAvailability.textContent =
property.availability ||
"Available";

}


const modalDescription =
document.getElementById(
"modalDescription"
);

if(modalDescription){

modalDescription.textContent =
property.description ||
"No description provided.";

}


/* ================================
   AMENITIES
================================ */

let amenities =
property.amenities;


if(Array.isArray(amenities)){

amenities =
amenities.join(", ");

}


if(
typeof amenities === "object" &&
amenities !== null
){

amenities =
Object.values(
amenities
).join(", ");

}


const modalAmenities =
document.getElementById(
"modalAmenities"
);

if(modalAmenities){

modalAmenities.textContent =
amenities ||
"Not specified";

}


/* ================================
   MODAL IMAGE
================================ */

const modalImage =
document.getElementById(
"modalImage"
);

const imageUrl =
getFirstImage(
property
);


if(modalImage){

if(imageUrl){

modalImage.innerHTML = `

<img
src="${escapeHtml(imageUrl)}"
alt="${escapeHtml(
property.title ||
"Property"
)}"
onerror="
this.onerror=null;
this.outerHTML='<div class=&quot;placeholder&quot;>🏠</div>';
"
>

`;

}else{

modalImage.innerHTML =
'<div class="placeholder">🏠</div>';

}

}


/* ================================
   BOOK BUTTON
================================ */

const modalBook =
document.getElementById(
"modalBook"
);

if(modalBook){

modalBook.onclick =
function(){

bookTour(
property.id
);

};

}


/* ================================
   OPEN MODAL
================================ */

const detailsModal =
document.getElementById(
"detailsModal"
);

if(detailsModal){

detailsModal.style.display =
"block";

}

document.body.style.overflow =
"hidden";

}


/* ================================
   CLOSE DETAILS
================================ */

function closeDetails(){

const detailsModal =
document.getElementById(
"detailsModal"
);

if(detailsModal){

detailsModal.style.display =
"none";

}

document.body.style.overflow =
"";

}


/* ================================
   BOOK TOUR
================================ */

function bookTour(id){

const property =
allProperties.find(
p =>
Number(p.id) ===
Number(id)
);

if(!property){

return;

}


const message =
"Hello Nyumbani Housing, I would like to book a House Tour Agent for: " +
(
property.title ||
"Property"
) +
". I understand the viewing fee is KSh 1,500.";


const url =
"https://wa.me/254738264143?text=" +
encodeURIComponent(
message
);

window.open(
url,
"_blank"
);

}


/* ================================
   FILTER PROPERTIES
================================ */

function filterProperties(){

const searchInput =
document.getElementById(
"searchInput"
);

const locationFilter =
document.getElementById(
"locationFilter"
);

const typeFilter =
document.getElementById(
"typeFilter"
);

const rentFilter =
document.getElementById(
"rentFilter"
);


const search =
searchInput
? searchInput.value.toLowerCase().trim()
: "";


const location =
locationFilter
? locationFilter.value
: "";


const type =
typeFilter
? typeFilter.value
: "";


const maxRent =
rentFilter
? rentFilter.value
: "";


const filtered =
allProperties.filter(
property => {


const searchable =
(
(property.title || "") +
" " +
(property.location || "") +
" " +
(property.area || "") +
" " +
(property.description || "")
)
.toLowerCase();


const matchesSearch =
!search ||
searchable.includes(
search
);


const matchesLocation =
!location ||
property.location ===
location;


const matchesType =
!type ||
property.property_type ===
type;


const matchesRent =
!maxRent ||
Number(
property.price || 0
) <=
Number(maxRent);


return (
matchesSearch &&
matchesLocation &&
matchesType &&
matchesRent
);

});


renderProperties(
filtered
);


const homes =
document.getElementById(
"homes"
);

if(homes){

homes.scrollIntoView({
behavior:"smooth"
});

}

}


/* ================================
   ENTER KEY SEARCH
================================ */

const searchInput =
document.getElementById(
"searchInput"
);

if(searchInput){

searchInput.addEventListener(
"keyup",
function(event){

if(event.key === "Enter"){

filterProperties();

}

}
);

}


/* ================================
   CLOSE MODAL
================================ */

window.addEventListener(
"click",
function(event){

const modal =
document.getElementById(
"detailsModal"
);

if(
modal &&
event.target === modal
){

closeDetails();

}

}
);


/* ================================
   START WEBSITE
================================ */

loadProperties();

</script>
