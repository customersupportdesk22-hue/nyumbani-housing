<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nyumbani Housing | Find Your Next Home in Kenya</title>

  <meta
    name="description"
    content="Nyumbani Housing helps you find quality rental homes, apartments, bedsitters, studios and houses across Kenya."
  >

  <meta name="theme-color" content="#0f766e">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #f59e0b;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;

      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.15);

      --radius: 16px;
      --max-width: 1200px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      font-size: 1.25rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mobile-menu-btn {
      display: none;
      border: 0;
      background: var(--light);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      font-size: 1.3rem;
    }

    .mobile-menu {
      display: none;
      padding: 15px 0 20px;
      border-top: 1px solid var(--border);
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 12px 0;
      font-weight: 600;
    }

    /* =========================
       BUTTONS
       ========================= */

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 800;
      transition: all 0.2s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: var(--white);
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary-light);
    }

    .btn-light {
      background: var(--white);
      color: var(--primary);
    }

    .btn-dark {
      background: var(--dark);
      color: var(--white);
    }

    .btn-success {
      background: var(--success);
      color: var(--white);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--white);
    }

    .btn-small {
      padding: 9px 12px;
      font-size: 0.86rem;
    }

    /* =========================
       HERO
       ========================= */

    .hero {
      padding: 75px 0 65px;
      background:
        radial-gradient(circle at 10% 10%, rgba(20, 184, 166, 0.12), transparent 35%),
        radial-gradient(circle at 90% 30%, rgba(245, 158, 11, 0.10), transparent 30%),
        var(--white);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 50px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero h1 {
      color: var(--dark);
      font-size: clamp(2.4rem, 5vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero-text {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 650px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .stat strong {
      display: block;
      color: var(--dark);
      font-size: 1.55rem;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .hero-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }

    .hero-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .hero-card-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--dark);
    }

    .live-badge {
      background: #dcfce7;
      color: #166534;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .hero-property {
      overflow: hidden;
      border-radius: 18px;
      background: var(--light);
    }

    .hero-property-image {
      height: 250px;
      width: 100%;
      object-fit: cover;
    }

    .hero-property-info {
      padding: 18px;
    }

    .hero-property-info h3 {
      color: var(--dark);
      margin-bottom: 5px;
    }

    .hero-property-location {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .hero-property-price {
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 900;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-section {
      margin-top: -20px;
      position: relative;
      z-index: 5;
    }

    .search-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr 0.8fr auto;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      color: var(--dark);
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      outline: none;
      color: var(--text);
      background: var(--white);
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.10);
    }

    /* =========================
       GENERAL SECTIONS
       ========================= */

    section {
      scroll-margin-top: 90px;
    }

    .section {
      padding: 80px 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-heading small {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 900;
      font-size: 0.75rem;
    }

    .section-heading h2 {
      color: var(--dark);
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      line-height: 1.15;
      margin-top: 7px;
    }

    .section-heading p {
      color: var(--muted);
      margin-top: 8px;
      max-width: 650px;
    }

    .results-count {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* =========================
       PROPERTY CARDS
       ========================= */

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .property-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .property-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .property-image-wrap {
      position: relative;
      height: 230px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .property-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: #94a3b8;
    }

    .property-status {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 900;
      background: #dcfce7;
      color: #166534;
    }

    .property-status.unavailable {
      background: #fee2e2;
      color: #991b1b;
    }

    .photo-count {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.78);
      color: white;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .property-content {
      padding: 18px;
    }

    .property-type {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .property-title {
      color: var(--dark);
      font-size: 1.12rem;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .property-location {
      color: var(--muted);
      font-size: 0.88rem;
      display: flex;
      gap: 5px;
      align-items: center;
      margin-bottom: 14px;
    }

    .property-price {
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .property-price span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .viewing-fee {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 14px;
    }

    .property-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }

    .meta-pill {
      padding: 6px 8px;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.74rem;
      color: var(--text);
      font-weight: 700;
    }

    .property-description {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .property-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .property-actions .btn:last-child {
      grid-column: 1 / -1;
    }

    /* =========================
       LOADING / EMPTY
       ========================= */

    .state-box {
      grid-column: 1 / -1;
      padding: 50px 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
    }

    .state-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .state-box h3 {
      color: var(--dark);
      margin-bottom: 6px;
    }

    .state-box p {
      color: var(--muted);
      max-width: 550px;
      margin: 0 auto;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 15px;
      border: 4px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       WHY NYUMBANI
       ========================= */

    .features-section {
      background: var(--white);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .feature-card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      border-radius: 13px;
      font-size: 1.35rem;
      margin-bottom: 15px;
    }

    .feature-card h3 {
      color: var(--dark);
      margin-bottom: 7px;
      font-size: 1.02rem;
    }

    .feature-card p {
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* =========================
       VIEWING FEE
       ========================= */

    .fee-section {
      padding: 60px 0;
    }

    .fee-box {
      background: var(--dark);
      color: white;
      border-radius: 22px;
      padding: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .fee-box h2 {
      font-size: 1.8rem;
      margin-bottom: 7px;
    }

    .fee-box p {
      color: #cbd5e1;
      max-width: 700px;
    }

    .fee-amount {
      flex-shrink: 0;
      text-align: center;
      padding: 18px 25px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
    }

    .fee-amount strong {
      display: block;
      font-size: 1.7rem;
      color: white;
    }

    .fee-amount span {
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    /* =========================
       ABOUT / CONTACT
       ========================= */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .about-box {
      background: var(--primary-light);
      border-radius: 24px;
      padding: 35px;
    }

    .about-box h3 {
      color: var(--primary-dark);
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .about-box p {
      color: var(--text);
    }

    .contact-list {
      display: grid;
      gap: 13px;
      margin-top: 20px;
    }

    .contact-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .contact-item-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      border-radius: 9px;
    }

    .contact-item strong {
      display: block;
      color: var(--dark);
      font-size: 0.88rem;
    }

    .contact-item span {
      color: var(--muted);
      font-size: 0.84rem;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      background: var(--dark);
      color: white;
      padding: 50px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 35px;
    }

    .footer-logo {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .footer-about {
      color: #94a3b8;
      max-width: 450px;
      font-size: 0.9rem;
    }

    footer h3 {
      font-size: 0.95rem;
      margin-bottom: 13px;
    }

    footer ul {
      list-style: none;
    }

    footer li {
      margin-bottom: 9px;
    }

    footer li a {
      color: #94a3b8;
      font-size: 0.88rem;
    }

    footer li a:hover {
      color: white;
    }

    .footer-bottom {
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #94a3b8;
      font-size: 0.78rem;
    }

    /* =========================
       MODAL
       ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      width: min(950px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      font-size: 1.3rem;
    }

    .modal-gallery {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 5px;
      background: #e2e8f0;
    }

    .modal-main-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    .modal-thumbs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      max-height: 400px;
      overflow: auto;
    }

    .modal-thumb {
      height: 130px;
      width: 100%;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.8;
    }

    .modal-thumb:hover {
      opacity: 1;
    }

    .modal-body {
      padding: 25px;
    }

    .modal-type {
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .modal-title {
      color: var(--dark);
      font-size: 1.8rem;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .modal-location {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .modal-price {
      color: var(--primary);
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .modal-info {
      background: var(--light);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 10px;
    }

    .modal-info strong {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .modal-info span {
      font-weight: 800;
      color: var(--dark);
    }

    .modal-description {
      color: var(--text);
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .modal-amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .modal-amenity {
      padding: 7px 10px;
      background: var(--primary-light);
      color: var(--primary-
