<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nyumbani Housing | Find Your Next Home in Kenya</title>

  <meta
    name="description"
    content="Nyumbani Housing helps you find quality rental homes, apartments, bedsitters, studios and houses across Kenya."
  >

  <meta name="theme-color" content="#0f766e">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #f59e0b;

      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;

      --success: #16a34a;
      --danger: #dc2626;

      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.15);

      --radius: 16px;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    body.modal-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 32px, var(--max-width));
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.2rem;
      color: var(--dark);
      white-space: nowrap;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      font-size: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links a {
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .mobile-menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      font-size: 1.25rem;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 82px 0 72px;
      background:
        radial-gradient(circle at top right, rgba(20, 184, 166, 0.13), transparent 35%),
        linear-gradient(135deg, #f0fdfa 0%, #ffffff 55%, #fffbeb 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 50px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #99f6e4;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .hero h1 {
      color: var(--dark);
      font-size: clamp(2.3rem, 5vw, 4.7rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
      max-width: 760px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      margin-top: 22px;
      max-width: 680px;
      font-size: 1.08rem;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 800;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: white;
      background: var(--primary);
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.22);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: white;
      border-color: var(--border);
      color: var(--dark);
    }

    .btn-secondary:hover {
      border-color: #99f6e4;
      background: #f0fdfa;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 38px;
      max-width: 650px;
    }

    .stat {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .stat strong {
      display: block;
      color: var(--dark);
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .hero-card {
      position: relative;
      min-height: 390px;
      border-radius: 28px;
      overflow: hidden;
      background:
        linear-gradient(145deg, #115e59, #0f766e);
      box-shadow: var(--shadow-lg);
      padding: 30px;
      color: white;
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .hero-card::before {
      width: 260px;
      height: 260px;
      right: -100px;
      top: -90px;
    }

    .hero-card::after {
      width: 180px;
      height: 180px;
      left: -80px;
      bottom: -70px;
    }

    .hero-card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-house-icon {
      position: absolute;
      top: 20px;
      right: 26px;
      font-size: 5.5rem;
      opacity: 0.95;
    }

    .hero-card h3 {
      font-size: 1.8rem;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-card p {
      color: rgba(255,255,255,0.82);
      font-size: 0.95rem;
    }

    .hero-card-list {
      list-style: none;
      margin-top: 22px;
      display: grid;
      gap: 9px;
    }

    .hero-card-list li {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.9rem;
    }

    /* =========================
       SEARCH
    ========================== */

    .search-wrap {
      position: relative;
      z-index: 20;
      margin-top: -28px;
    }

    .search-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 22px;
    }

    .search-title {
      color: var(--dark);
      font-size: 1.05rem;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .search-form {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 0.75fr 0.75fr auto;
      gap: 10px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: var(--dark);
      border-radius: 10px;
      min-height: 46px;
      padding: 0 12px;
      outline: none;
      transition: 0.2s ease;
    }

    .field textarea {
      padding-top: 10px;
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
    }

    .search-submit {
      align-self: end;
      min-height: 46px;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: var(--primary);
      color: white;
      font-weight: 800;
    }

    .search-submit:hover {
      background: var(--primary-dark);
    }

    .clear-search {
      align-self: end;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 15px;
      background: white;
      color: var(--text);
      font-weight: 700;
    }

    /* =========================
       SECTIONS
    ========================== */

    section {
      scroll-margin-top: 90px;
    }

    .section {
      padding: 78px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 7px;
    }

    .section h2 {
      color: var(--dark);
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      line-height: 1.15;
    }

    .section-subtitle {
      max-width: 650px;
      color: var(--muted);
      margin-top: 8px;
    }

    .listing-count {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* =========================
       PROPERTY CARDS
    ========================== */

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .property-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .property-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .property-image-wrap {
      position: relative;
      height: 235px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .property-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, #ccfbf1, #f0fdfa);
      color: var(--primary-dark);
      font-size: 4rem;
    }

    .property-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      color: var(--primary-dark);
      font-size: 0.72rem;
      font-weight: 900;
      box-shadow: var(--shadow-sm);
    }

    .availability {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 900;
      background: rgba(255,255,255,0.95);
    }

    .availability.available {
      color: #166534;
    }

    .availability.unavailable {
      color: #991b1b;
    }

    .photo-count {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15,23,42,0.78);
      color: white;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .property-body {
      padding: 18px;
    }

    .property-type {
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .property-title {
      margin-top: 5px;
      color: var(--dark);
      font-size: 1.13rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .property-location {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .property-price {
      margin-top: 15px;
      color: var(--dark);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .property-price span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .property-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .meta-item {
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .viewing-fee {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      padding: 10px 11px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      color: #92400e;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .property-description {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .amenity {
      color: var(--primary-dark);
      background: var(--primary-light);
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .property-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 17px;
    }

    .property-actions .btn {
      min-height: 42px;
      font-size: 0.82rem;
      padding: 0 10px;
    }

    .btn-call {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }

    .btn-whatsapp {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }

    .btn-details {
      grid-column: 1 / -1;
      background: white;
      color: var(--primary-dark);
      border-color: #99f6e4;
    }

    .btn-details:hover {
      background: var(--primary-light);
    }

    /* =========================
       STATES
    ========================== */

    .state-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .state-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .state-box h3 {
      color: var(--dark);
      font-size: 1.2rem;
    }

    .state-box p {
      max-width: 580px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       WHY SECTION
    ========================== */

    .why-section {
      background: white;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .why-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
      background: white;
    }

    .why-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      font-size: 1.4rem;
      margin-bottom: 16px;
    }

    .why-card h3 {
      color: var(--dark);
      margin-bottom: 7px;
      font-size: 1.05rem;
    }

    .why-card p {
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* =========================
       VIEWING FEE
    ========================== */

    .fee-section {
      padding: 55px 0;
    }

    .fee-card {
      background:
        linear-gradient(135deg, #0f766e, #115e59);
      color: white;
      border-radius: 22px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 25px;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .fee-card h2 {
      font-size: 1.7rem;
      margin-bottom: 7px;
    }

    .fee-card p {
      color: rgba(255,255,255,0.82);
      max-width: 720px;
    }

    .fee-amount {
      font-size: 2rem;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================
       ABOUT / CONTACT
    ========================== */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .about-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .about-card h3 {
      color: var(--dark);
      margin-bottom: 10px;
    }

    .about-card p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .contact-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border-radius: 10px;
      background: var(--light);
      border: 1px solid var(--border);
    }

    .contact-item strong {
      color: var(--dark);
      display: block;
      font-size: 0.83rem;
    }

    .contact-item span {
      color: var(--muted);
      display: block;
      font-size: 0.8rem;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.72);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(100%, 960px);
      max-height: 94vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close {
      position: sticky;
      top: 12px;
      float: right;
      z-index: 5;
      margin: 12px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(15,23,42,0.78);
      color: white;
      font-size: 1.3rem;
    }

    .modal-gallery {
      position: relative;
      height: 430px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .modal-main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-nav {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .gallery-btn {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(15,23,42,0.7);
      color: white;
      font-size: 1.25rem;
    }

    .gallery-counter {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.75);
      color: white;
      padding: 5px 10px;
      bo
