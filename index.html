<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nyumbani Housing | Find Your Next Home in Kenya</title>

  <meta
    name="description"
    content="Nyumbani Housing helps you find quality rental homes, apartments, bedsitters, studios and houses across Kenya."
  >

  <meta name="theme-color" content="#0f766e">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #f59e0b;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;

      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.15);

      --radius: 16px;
      --max-width: 1200px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
