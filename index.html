<script>

const SUPABASE_URL =
"https://lcevyljupucnynpivygr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GYJxHmYaDMn-8McoGduBLw_ZMhWg5EO";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allProperties = [];

function escapeHtml(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   GET PROPERTY IMAGE
================================ */

function getFirstImage(property){

let urls = property.image_urls;

/* Supabase JSONB can sometimes arrive
   as an array and sometimes as a string */

if(typeof urls === "string"){

try{

urls = JSON.parse(urls);

}catch(error){

console.error(
"Could not parse image_urls:",
urls
);

return "";

}

}

if(Array.isArray(urls) && urls.length > 0){

return String(urls[0]);

}

return "";

}


/* ================================
   IMAGE HTML
================================ */

function createImageHTML(property){

const imageUrl =
getFirstImage(property);

if(!imageUrl){

return '<div class="placeholder">🏠</div>';

}

return `
<img
src="${escapeHtml(imageUrl)}"
alt="${escapeHtml(property.title || "Property")}"
loading="lazy"
onerror="
this.onerror=null;
this.outerHTML='<div class=&quot;placeholder&quot;>🏠</div>';
"
>
`;

}


/* ================================
   LOAD PROPERTIES
================================ */

async function loadProperties(){

const loading =
document.getElementById("loading");

try{

const {data,error} =
await supabaseClient
.from("properties")
.select("*")
.eq("published",true)
.order("created_at",{ascending:false});

if(error){

throw error;

}

console.log(
"Properties loaded:",
data
);

allProperties =
data || [];

loading.style.display =
"none";

renderProperties(
allProperties
);

}catch(error){

console.error(
"Property loading error:",
error
);

loading.style.display =
"none";

document.getElementById(
"propertyGrid"
).innerHTML = "";

document.getElementById(
"emptyState"
).style.display =
"block";

document.getElementById(
"listingCount"
).textContent =
"Unable to load listings";

}

}


/* ================================
   RENDER PROPERTIES
================================ */

function renderProperties(properties){

const grid =
document.getElementById(
"propertyGrid"
);

const empty =
document.getElementById(
"emptyState"
);

const count =
document.getElementById(
"listingCount"
);

grid.innerHTML = "";

count.textContent =
properties.length +
(
properties.length === 1
? " property available"
: " properties available"
);

if(properties.length === 0){

empty.style.display =
"block";

return;

}

empty.style.display =
"none";


properties.forEach(
property => {

const card =
document.createElement(
"div"
);

card.className =
"card";


/* GET IMAGE */

const imageHTML =
createImageHTML(
property
);


const rent =
Number(
property.price || 0
).toLocaleString();


const description =
property.description ||
"No description provided.";


const shortDescription =
description.length > 150
? description.substring(0,150) + "..."
: description;


/* CARD */

card.innerHTML = `

<div class="photo">

${imageHTML}

<div class="live">
● LIVE
</div>

<div class="type">
${escapeHtml(
property.property_type ||
"Property"
)}
</div>

</div>


<div class="card-body">

<h3>
${escapeHtml(
property.title ||
"Property"
)}
</h3>


<div class="location">

📍
${escapeHtml(
property.area || ""
)}

${
property.area &&
property.location
? ", "
: ""
}

${escapeHtml(
property.location || ""
)}

</div>


<div class="price">

KSh ${rent} /
${escapeHtml(
property.price_period ||
"month"
)}

</div>


<div class="preview">

${escapeHtml(
shortDescription
)}

</div>


<div class="card-buttons">

<button
class="details-btn"
onclick="showDetails(${property.id})"
>
View Details
</button>


<button
class="book-btn"
onclick="bookTour(${property.id})"
>
Book Tour
</button>

</div>

</div>

`;


grid.appendChild(
card
);

});

}


/* ================================
   PROPERTY DETAILS
================================ */

function showDetails(id){

const property =
allProperties.find(
p =>
Number(p.id) ===
Number(id)
);

if(!property){

return;

}


document.getElementById(
"modalTitle"
).textContent =
property.title ||
"Property";


document.getElementById(
"modalLocation"
).textContent =
"📍 " +
(property.area || "") +
(
property.area &&
property.location
? ", "
: ""
) +
(property.location || "");


document.getElementById(
"modalPrice"
).textContent =
"KSh " +
Number(
property.price || 0
).toLocaleString() +
" / " +
(
property.price_period ||
"month"
);


document.getElementById(
"modalType"
).textContent =
property.property_type ||
"Not specified";


document.getElementById(
"modalArea"
).textContent =
property.area ||
"Not specified";


document.getElementById(
"modalBedrooms"
).textContent =
property.bedrooms !== null &&
property.bedrooms !== undefined
? property.bedrooms
: "Not specified";


document.getElementById(
"modalBathrooms"
).textContent =
property.bathrooms !== null &&
property.bathrooms !== undefined
? property.bathrooms
: "Not specified";


document.getElementById(
"modalDeposit"
).textContent =
property.security_deposit
? "KSh " +
Number(
property.security_deposit
).toLocaleString()
: "Not specified";


document.getElementById(
"modalAvailability"
).textContent =
property.availability ||
"Available";


document.getElementById(
"modalDescription"
).textContent =
property.description ||
"No description provided.";


/* AMENITIES */

let amenities =
property.amenities;


if(Array.isArray(amenities)){

amenities =
amenities.join(", ");

}


if(
typeof amenities === "object" &&
amenities !== null
){

amenities =
Object.values(
amenities
).join(", ");

}


document.getElementById(
"modalAmenities"
).textContent =
amenities ||
"Not specified";


/* MODAL IMAGE */

const modalImage =
document.getElementById(
"modalImage"
);

const imageUrl =
getFirstImage(
property
);


if(imageUrl){

modalImage.innerHTML = `

<img
src="${escapeHtml(imageUrl)}"
alt="${escapeHtml(
property.title ||
"Property"
)}"
onerror="
this.onerror=null;
this.outerHTML='<div class=&quot;placeholder&quot;>🏠</div>';
"
>

`;

}else{

modalImage.innerHTML =
'<div class="placeholder">🏠</div>';

}


/* BOOK BUTTON */

document.getElementById(
"modalBook"
).onclick =
function(){

bookTour(
property.id
);

};


document.getElementById(
"detailsModal"
).style.display =
"block";

document.body.style.overflow =
"hidden";

}


/* ================================
   CLOSE DETAILS
================================ */

function closeDetails(){

document.getElementById(
"detailsModal"
).style.display =
"none";

document.body.style.overflow =
"";

}


/* ================================
   BOOK TOUR
================================ */

function bookTour(id){

const property =
allProperties.find(
p =>
Number(p.id) ===
Number(id)
);

if(!property){

return;

}


const message =
"Hello Nyumbani Housing, I would like to book a House Tour Agent for: " +
(
property.title ||
"Property"
) +
". I understand the viewing fee is KSh 1,500.";


const url =
"https://wa.me/254738264143?text=" +
encodeURIComponent(
message
);

window.open(
url,
"_blank"
);

}


/* ================================
   FILTER PROPERTIES
================================ */

function filterProperties(){

const search =
document.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


const location =
document.getElementById(
"locationFilter"
).value;


const type =
document.getElementById(
"typeFilter"
).value;


const maxRent =
document.getElementById(
"rentFilter"
).value;


const filtered =
allProperties.filter(
property => {


const searchable =
(
(property.title || "") +
" " +
(property.location || "") +
" " +
(property.area || "") +
" " +
(property.description || "")
)
.toLowerCase();


const matchesSearch =
!search ||
searchable.includes(
search
);


const matchesLocation =
!location ||
property.location ===
location;


const matchesType =
!type ||
property.property_type ===
type;


const matchesRent =
!maxRent ||
Number(
property.price || 0
) <=
Number(maxRent);


return (
matchesSearch &&
matchesLocation &&
matchesType &&
matchesRent
);

});


renderProperties(
filtered
);


document.getElementById(
"homes"
).scrollIntoView({
behavior:"smooth"
});

}


/* ================================
   ENTER KEY SEARCH
================================ */

document
.getElementById(
"searchInput"
)
.addEventListener(
"keyup",
function(event){

if(event.key === "Enter"){

filterProperties();

}

}
);


/* ================================
   CLOSE MODAL
================================ */

window.addEventListener(
"click",
function(event){

const modal =
document.getElementById(
"detailsModal"
);

if(event.target === modal){

closeDetails();

}

}
);


/* ================================
   START WEBSITE
================================ */

loadProperties();

</script>
